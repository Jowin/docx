services:
  postgres:
    image: postgres:16-alpine
    container_name: designtime-postgres
    environment:
      POSTGRES_USER: designtime
      POSTGRES_PASSWORD: designtime
      POSTGRES_DB: designtime
    ports:
      - "5432:5432"
    volumes:
      - designtime-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U designtime -d designtime"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..                      # the repo root: the image carries the runtime too
      dockerfile: designtime/Dockerfile
    container_name: designtime-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://designtime:designtime@postgres:5432/designtime
      # Unset = each config's own model provider. Set MODEL_GATEWAY_URL and
      # MODEL_GATEWAY_TOKEN to let the gateway write skills and run gateway configs.
      LEARNING_MODEL_PROVIDER: ${LEARNING_MODEL_PROVIDER:-}
      MODEL_GATEWAY_URL: ${MODEL_GATEWAY_URL:-}
      MODEL_GATEWAY_TOKEN: ${MODEL_GATEWAY_TOKEN:-}
      RUNTIME_URL: http://runtime:8000         # corrections import reads the runtime's review export
    volumes:
      # The runtime configs in this repo: learned versions land here, where the
      # runtime service below serves them and git can track them.
      - ../runtime/configs:/configs
      - ${LEARNING_DATA:-../runtime/data}:/data:ro
      - learning-state:/learning-state
    ports:
      - "8000:8000"
    # Migrations run on start so a fresh clone comes up with one command.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn dataextractor_designtime.main:app --host 0.0.0.0 --port 8000"

  runtime:
    build: ../runtime
    container_name: dataextractor-runtime
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CONFIG_ROOT: /configs
      # the runtime's tables live in their own schema of the same database
      DATABASE_URL: postgresql://designtime:designtime@postgres:5432/designtime
      DB_SCHEMA: extractor
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      MODEL_GATEWAY_URL: ${MODEL_GATEWAY_URL:-}
      MODEL_GATEWAY_TOKEN: ${MODEL_GATEWAY_TOKEN:-}
      # OCR: Textract with your AWS account (falls back to tesseract when unset)
      OCR_ENGINE: ${OCR_ENGINE:-textract}
      TEXTRACT_REGION: ${TEXTRACT_REGION:-}
      TEXTRACT_S3_BUCKET: ${TEXTRACT_S3_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    volumes:
      - ../runtime/configs:/configs:ro
      - ${LEARNING_DATA:-../runtime/data}:/data:ro
      - ${EXTRACTION_OUTPUT:-../runtime/output}:/output     # every result as CSV (OUTPUT_FORMATS)
    ports:
      - "8001:8000"

  # More queue workers on the same Postgres queue (scale with --scale runtime-worker=N).
  runtime-worker:
    build: ../runtime
    command: ["python", "-m", "extractor_service.worker"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CONFIG_ROOT: /configs
      # the runtime's tables live in their own schema of the same database
      DATABASE_URL: postgresql://designtime:designtime@postgres:5432/designtime
      DB_SCHEMA: extractor
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      MODEL_GATEWAY_URL: ${MODEL_GATEWAY_URL:-}
      MODEL_GATEWAY_TOKEN: ${MODEL_GATEWAY_TOKEN:-}
      # OCR: Textract with your AWS account (falls back to tesseract when unset)
      OCR_ENGINE: ${OCR_ENGINE:-textract}
      TEXTRACT_REGION: ${TEXTRACT_REGION:-}
      TEXTRACT_S3_BUCKET: ${TEXTRACT_S3_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    volumes:
      - ../runtime/configs:/configs:ro
      - ${LEARNING_DATA:-../runtime/data}:/data:ro
      - ${EXTRACTION_OUTPUT:-../runtime/output}:/output     # every result as CSV (OUTPUT_FORMATS)

  # The console for both flows: http://localhost:4173
  ui:
    build: ../ui
    depends_on: [api, runtime]
    environment:
      RUNTIME_URL: http://runtime:8000
      DESIGNTIME_URL: http://api:8000
    ports:
      - "4173:4173"

volumes:
  designtime-pgdata:
  learning-state:
