[project]
name = "dataextractor-designtime"
version = "0.1.0"
description = "DataExtractor design-time: design agents, pattern learning, Postgres artifact registry, per-component APIs"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langgraph>=1.2",
    "langgraph-checkpoint-postgres>=3.1",   # learning memory (store) and resumable learning (checkpoints)
    "psycopg[binary]>=3.2",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
